name: Organization docs

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require portfolio control documents
        run: |
          test -s CODE_OF_CONDUCT.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s SUPPORT.md
          test -s .github/ISSUE_TEMPLATE/bug_report.yml
          test -s .github/ISSUE_TEMPLATE/config.yml
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s profile/README.md
          test -s portfolio/RELEASE_DEFINITION.md
          test -s portfolio/LAUNCH_SLATE.md
          test -s portfolio/DATA_COST_MATRIX.md
          test -s portfolio/REPOSITORIES.json
          test -s portfolio/STATUS.md
      - name: Test portfolio validator
        run: python3 -m unittest discover -s tests -v
      - name: Reject stale generated status
        run: python3 scripts/portfolio_status.py --check
